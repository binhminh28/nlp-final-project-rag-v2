[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunking"
version = "0.1.0"
description = "Deterministic preprocessing for structure-aware RAG experiments"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.2.0",
    "tiktoken==0.12.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
preprocess-angular = "rag_chunking.cli.preprocess:main"
chunk-fixed = "rag_chunking.cli.chunk_fixed:main"
chunk-structure = "rag_chunking.cli.chunk_structure:main"
chunk-prompt = "rag_chunking.cli.chunk_prompt:main"
chunk-documents = "rag_chunking.cli.chunk_documents:main"
embed-chunks = "rag_chunking.cli.embed_chunks:main"
build-vector-index = "rag_chunking.cli.build_index:main"
retrieve = "rag_chunking.cli.retrieve:main"
evaluate-retrieval = "rag_chunking.cli.evaluate_retrieval:main"
evaluate-evidence-retrieval = "rag_chunking.cli.evaluate_evidence_retrieval:main"
audit-retrieval-relevance = "rag_chunking.cli.audit_relevance:main"
run-dense-depth-ablation = "rag_chunking.cli.run_dense_depth_ablation:main"
run-diversity-ablation = "rag_chunking.cli.run_diversity_ablation:main"
prepare-query-rewrites = "rag_chunking.cli.prepare_query_rewrites:main"
run-query-rewrite-ablation = "rag_chunking.cli.run_rewrite_ablation:main"
merge-query-rewrite-ablation = "rag_chunking.cli.merge_rewrite_ablation:main"
run-bm25-experiments = "rag_chunking.cli.run_bm25_experiments:main"
run-hybrid-experiment = "rag_chunking.cli.run_hybrid_experiment:main"
analyze-experiment-uncertainty = "rag_chunking.cli.analyze_experiment_uncertainty:main"
generate-answers = "rag_chunking.cli.generate_answers:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
