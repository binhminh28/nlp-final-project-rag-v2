[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunking"
version = "0.1.0"
description = "Deterministic preprocessing for structure-aware RAG experiments"
requires-python = ">=3.11"
dependencies = ["tiktoken==0.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
preprocess-angular = "rag_chunking.cli.preprocess:main"
chunk-fixed = "rag_chunking.cli.chunk_fixed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
